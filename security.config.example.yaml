# Security MCP — example config.
# Copy to security.config.yaml and edit. The MCP registers one tool per
# `collections[]` entry (using its `name`), plus a `tool_registry` tool
# for invokable actions.
#
# Source types:
#   file    — glob a local directory for matching files
#   http    — REST endpoint that returns a list and per-item content
#   github  — pull files from a GitHub repo over the API
#   mcp     — proxy to another MCP server (resources / tools)
#
# Use ${ENV_VAR} anywhere a string is expected to interpolate from the
# host environment at config-load time.

server:
  name: security-mcp
  instructions: |
    Before generating or modifying infrastructure, risk-bearing config,
    or anything that touches sensitive data:
      1. Call policy_tool(action=list) and read the policies that match.
      2. Call risk_index(action=list, query=<repo-or-component>) for context.
      3. Prefer paved_road_tool(action=list) over hand-rolled implementations.
      4. Validate with tool_registry(action=invoke, name=conftest, ...) before opening a PR.

collections:
  - name: policy_tool
    description: |
      Organizational security policies. Markdown is the human-readable
      spec; `.rego` is enforced via conftest.
    usage: |
      Optional directive attached to every list/get response — useful to
      make follow-up actions hard for the model to skip.
    sources:
      - type: file
        name: local-policies
        path: ./examples/policies
        patterns: ["**/*.md", "**/*.rego"]
      # - type: github
      #   name: central-policies
      #   owner: your-org
      #   repo:  security-policies
      #   path:  policies
      #   patterns: ["**/*.md", "**/*.rego"]
      #   token: "${SECURITY_REPO_TOKEN}"
      #   cache_ttl_ms: 120000    # optional: tree cache TTL (default 60000)
      # - type: http
      #   name: central-policy-api
      #   base_url: https://policies.your-org.example/v1
      #   list_path: /policies
      #   get_path:  /policies/{name}
      #   headers:   { Authorization: "Bearer ${POLICY_API_TOKEN}" }
      # - type: mcp
      #   name: policy-mcp
      #   command: npx
      #   args: ["-y", "@your-org/policy-mcp"]

  - name: risk_index
    description: Risk context — what risks actually matter for this org / repo / environment.
    sources:
      - type: file
        name: local-risk
        path: ./examples/risk
        patterns: ["**/*.md"]

  - name: paved_road_tool
    description: Paved roads — approved templates, modules, and reference architectures.
    sources:
      - type: file
        name: local-paved-roads
        path: ./examples/paved-roads
        patterns: ["**/*.md", "**/*.yaml", "**/*.tf"]

  # Add your own collections — runbooks, ADRs, design-system docs, etc.
  # The MCP doesn't hard-code "security" anywhere.
  # - name: runbooks
  #   description: Operational runbooks the agent should consult before incident steps.
  #   sources:
  #     - type: github
  #       owner: your-org
  #       repo:  runbooks
  #       path:  .
  #       patterns: ["**/*.md"]
  #       token: "${SECURITY_REPO_TOKEN}"

tools:
  description: Tools the agent can invoke directly via tool_registry.
  registry:
    - type: command
      name: conftest
      description: Run OPA/Rego policy checks against a JSON or YAML input file.
      command: conftest
      args: ["test", "--policy", "{{policy_path}}", "{{input_path}}"]
      input_schema:
        type: object
        properties:
          policy_path: { type: string, description: "directory containing .rego policies" }
          input_path:  { type: string, description: "file to test (terraform plan json, k8s manifest, …)" }
        required: [policy_path, input_path]

    # - type: http
    #   name: exception_tool
    #   description: Request a security exception. Returns ticket id + risk score.
    #   method: POST
    #   url: "${EXCEPTION_API_BASE_URL}/v1/exceptions"
    #   headers:
    #     Authorization: "Bearer ${EXCEPTION_API_TOKEN}"
    #   body_template:
    #     repo:           "{{repo}}"
    #     rule:           "{{rule}}"
    #     justification:  "{{justification}}"
    #     duration_hours: "{{duration_hours}}"
    #   input_schema:
    #     type: object
    #     properties:
    #       repo:           { type: string }
    #       rule:           { type: string }
    #       justification:  { type: string }
    #       duration_hours: { type: number }
    #     required: [repo, rule, justification]

  # Optional: tool-level usage directive attached to describe/invoke responses
  # usage: "always validate output before applying"
  # usage_on: every                   # every | never; default every
  #
  # Per-tool usage overrides the category-level directive:
  # - type: command
  #   name: conftest
  #   ...
  #   usage: "run this before every PR"
  #   validate_command: sh
  #   validate_args: ["-c", "test -f {{policy_path}}"]
  #   output_max_bytes: 524288       # truncate large outputs (default 1 MiB)
  #
  # Additional tools can come from other MCP servers:

# ─── Auth ───────────────────────────────────────────────────────────
# Pick one mode. The principal extracted is recorded on every audit
# log line.
#
# auth:
#   mode: iap                        # trusted reverse-proxy header
#   trusted_header: X-Goog-Authenticated-User-Email
#
# auth:
#   mode: oidc                        # Bearer JWT (Verify issuer + audience)
#   issuer: https://accounts.google.com
#   audience: <project-number>-<hash>.apps.googleusercontent.com
#
# auth:
#   mode: api_key                    # static key (constant-time compare)
#   header_name: X-API-Key           # default; omit to use default
#   keys_env: SECURITY_MCP_API_KEYS   # default; env var with comma-separated
#                                     #   key:principal pairs (or bare keys)
#
# auth:
#   mode: none                       # dev / closed network only

# ─── Metrics endpoint protection ───────────────────────────────────
# metrics_protect: true              # /metrics requires auth when mode≠none

# ─── Audit depth ────────────────────────────────────────────────────
# audit_record_args: false           # log full args (in addition to hash)

# ─── Per-tool RBAC (optional) ──────────────────────────────────────
# rbac:
#   default_allow: false             # deny unlisted principals by default
#   rules:
#     alice@example.com: [policy_tool, tool_registry]
#     ci-bot: ["*"]                  # wildcard — all tools
#   collections:
#     default_allow: false           # deny unlisted collections
#     rules:
#       alice@example.com: [policy_tool, risk_index]
#       ci-bot: ["*"]                # wildcard — all collections

# ─── Rate limiting (optional) ──────────────────────────────────────
# rate_limit:
#   window_ms: 60000                 # sliding window (default 60 s)
#   max_requests: 100                # max POST /mcp per window (default 100)
